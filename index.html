<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Player</title>
    <!-- Load library HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #error { color: #ff4444; text-align: center; margin-top: 20vh; font-family: sans-serif; display: none; font-size: 18px; }
    </style>
</head>
<body>
    <video id="video" controls autoplay muted playsinline></video>
    <div id="error">Stream tidak ditemukan atau URL tidak valid.</div>

    <script>
        const video = document.getElementById('video');
        const errorDiv = document.getElementById('error');
        
        // Ambil parameter ?url= dari address bar
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('url');

        if (!streamUrl) {
            errorDiv.style.display = 'block';
        } else {
            // Cek apakah browser support HLS.js (Chrome, Firefox, Edge)
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => console.log("Autoplay dicegah browser:", e));
                });
                
                // Handle error (misal link mati)
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad(); // Coba load ulang
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError(); // Coba recover
                                break;
                            default:
                                errorDiv.style.display = 'block';
                                hls.destroy();
                                break;
                        }
                    }
                });
            } 
            // Cek untuk Safari / iOS (biasanya native support HLS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(e => console.log("Autoplay dicegah browser:", e));
                });
            } 
            else {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
